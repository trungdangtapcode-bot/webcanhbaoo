<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Smart Alert login and registration" />
  <title>Smart Alert Login</title>
  <script>
    (function initStoredTheme() {
      try {
        const savedTheme = localStorage.getItem("smart-alert-theme");
        const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = savedTheme || (prefersLight ? "light" : "dark");
      } catch (_err) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d12;
      --panel: #10161d;
      --panel-soft: #141b24;
      --surface: #0d1319;
      --border: #24303c;
      --border-strong: #344251;
      --text: #eef4f8;
      --text-soft: #aeb9c4;
      --text-muted: #6e7b88;
      --teal: #31d6c0;
      --teal-soft: rgba(49, 214, 192, 0.14);
      --red: #ff5b63;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.34);
      --radius: 8px;
      --fast: 160ms ease;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fbff;
      --surface: #f4f7fb;
      --border: #d7e1ea;
      --border-strong: #b9c8d7;
      --text: #17202b;
      --text-soft: #516171;
      --text-muted: #7b8a99;
      --teal: #0f9485;
      --teal-soft: rgba(15, 148, 133, 0.11);
      --red: #d9434e;
      --shadow: 0 18px 45px rgba(29, 49, 68, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(49, 214, 192, 0.08), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .auth-shell {
      width: min(440px, 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(16, 22, 29, 0.98), rgba(9, 13, 18, 0.98));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    html[data-theme="light"] .auth-shell {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(244, 247, 251, 0.98));
    }

    .auth-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 20px;
      border-bottom: 1px solid var(--border);
      background:
        linear-gradient(135deg, rgba(49, 214, 192, 0.1), transparent 42%),
        var(--panel);
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border: 1px solid rgba(49, 214, 192, 0.36);
      border-radius: var(--radius);
      background: #0b1218;
      color: var(--teal);
    }

    .brand-mark svg {
      width: 20px;
      height: 20px;
    }

    .brand-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 760;
      white-space: nowrap;
    }

    .brand-title span {
      display: inline;
    }

    .theme-toggle {
      display: inline-grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-soft);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
    }

    .auth-body {
      display: grid;
      gap: 14px;
      padding: 18px 20px 20px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .auth-tab,
    .auth-submit {
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-soft);
      font-size: 13px;
      font-weight: 760;
      transition: border-color var(--fast), background var(--fast), color var(--fast);
    }

    .auth-tab.active,
    .auth-submit {
      border-color: rgba(49, 214, 192, 0.52);
      background: var(--teal-soft);
      color: var(--teal);
    }

    .auth-form {
      display: grid;
      gap: 10px;
    }

    .social-login {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .social-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 760;
      transition: border-color var(--fast), background var(--fast), color var(--fast);
    }

    .social-button:hover {
      border-color: var(--border-strong);
      background: var(--panel-soft);
    }

    .social-icon {
      display: inline-grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
    }

    .social-icon.google {
      background: #ea4335;
    }

    .social-icon.guest {
      background: #5f6f7f;
    }

    .auth-field {
      width: 100%;
      min-width: 0;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    html[data-theme="light"] .auth-field,
    html[data-theme="light"] .auth-tab {
      background: #ffffff;
    }

    .auth-field:focus {
      border-color: rgba(49, 214, 192, 0.62);
      box-shadow: 0 0 0 3px rgba(49, 214, 192, 0.1);
    }

    .auth-status {
      min-height: 18px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .auth-status.error {
      color: var(--red);
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <header class="auth-header">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3.2 19 6v5.2c0 4.5-2.8 8.4-7 9.6-4.2-1.2-7-5.1-7-9.6V6l7-2.8Z" stroke="currentColor" stroke-width="1.8" />
            <path d="M8.6 12.2 10.8 14.4 15.7 9.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <h1 class="brand-title"><span>Smart</span> <span>Alert</span></h1>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" title="Switch theme" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 7.2a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6ZM12 2.8v2M12 19.2v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.8 12h2M19.2 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <section class="auth-body">
      <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
        <button class="auth-tab active" type="button" data-auth-mode="login">Login</button>
        <button class="auth-tab" type="button" data-auth-mode="register">Register</button>
      </div>
      <form class="auth-form" id="auth-form">
        <input class="auth-field" id="auth-name" type="text" placeholder="Display name" autocomplete="name" hidden />
        <input class="auth-field" id="auth-email" type="text" placeholder="Username or email" autocomplete="username" required />
        <input class="auth-field" id="auth-password" type="password" placeholder="Password" autocomplete="current-password" required minlength="5" />
        <button class="auth-submit" id="auth-submit" type="submit">Login</button>
        <div class="auth-status" id="auth-status"></div>
      </form>
      <div class="social-login" aria-label="Social login">
        <button class="social-button" id="google-login" type="button">
          <span class="social-icon google">G</span>
          Google
        </button>
        <button class="social-button" id="guest-login" type="button">
          <span class="social-icon guest">K</span>
          Guest
        </button>
      </div>
    </section>
  </main>

  <script>
    const AUTH_USERS_KEY = "smart-alert-auth-users";
    const AUTH_SESSION_KEY = "smart-alert-auth-session";
    const THEME_STORAGE_KEY = "smart-alert-theme";
    const GOOGLE_CLIENT_ID = "952069413746-0oh9didh5r9uflcsjiipbs2ipbfjhg6j.apps.googleusercontent.com";
    let authMode = "login";

    function getStoredUsers() {
      try {
        const users = JSON.parse(localStorage.getItem(AUTH_USERS_KEY) || "[]");
        return Array.isArray(users) ? users : [];
      } catch (_err) {
        return [];
      }
    }

    function saveStoredUsers(users) {
      localStorage.setItem(AUTH_USERS_KEY, JSON.stringify(users));
    }

    async function hashPassword(password) {
      if (window.crypto?.subtle) {
        const bytes = new TextEncoder().encode(password);
        const digest = await crypto.subtle.digest("SHA-256", bytes);
        return Array.from(new Uint8Array(digest)).map((byte) => byte.toString(16).padStart(2, "0")).join("");
      }
      return btoa(unescape(encodeURIComponent(password)));
    }

    function setStatus(message, isError = false) {
      const status = document.getElementById("auth-status");
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function setAuthMode(mode) {
      authMode = mode === "register" ? "register" : "login";
      document.getElementById("auth-form").reset();
      document.querySelectorAll("[data-auth-mode]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.authMode === authMode);
      });

      const nameField = document.getElementById("auth-name");
      const passwordField = document.getElementById("auth-password");
      const submit = document.getElementById("auth-submit");
      nameField.hidden = authMode !== "register";
      nameField.required = authMode === "register";
      passwordField.autocomplete = authMode === "register" ? "new-password" : "current-password";
      submit.textContent = authMode === "register" ? "Create account" : "Login";
      setStatus(authMode === "register"
        ? "Create a local operator account on this browser."
        : "");
    }

    function loginAsGuest() {
      setAuthSession({
        name: "Guest",
        email: "guest@local",
        provider: "guest",
      });
    }

    function getGoogleRedirectUri() {
      return window.location.origin + window.location.pathname;
    }

    function startGoogleRedirectLogin() {
      const params = new URLSearchParams({
        client_id: GOOGLE_CLIENT_ID,
        redirect_uri: getGoogleRedirectUri(),
        response_type: "token",
        scope: "openid email profile",
        prompt: "select_account",
      });
      window.location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + params.toString();
    }

    function requestGoogleLogin() {
      setStatus("Opening Google login...");
      startGoogleRedirectLogin();
    }

    async function finishGoogleRedirectLogin() {
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const accessToken = hash.get("access_token");
      const error = hash.get("error");
      if (!accessToken && !error) return;

      history.replaceState(null, document.title, window.location.pathname + window.location.search);
      if (error) {
        setStatus("Google login failed: " + error, true);
        return;
      }

      try {
        const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
          headers: { Authorization: "Bearer " + accessToken },
        });
        if (!res.ok) throw new Error("Google profile request failed");
        const profile = await res.json();
        setAuthSession({
          name: profile.name || profile.email,
          email: profile.email,
          picture: profile.picture,
          provider: "google",
        });
      } catch (_err) {
        setStatus("Could not read your Google profile.", true);
      }
    }

    function setAuthSession(user) {
      localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify({
        email: user.email,
        name: user.name || user.email,
        provider: user.provider || "local",
        signedInAt: new Date().toISOString(),
      }));
      window.location.href = "index.html";
    }

    async function submitAuthForm(event) {
      event.preventDefault();
      const name = document.getElementById("auth-name").value.trim();
      const email = document.getElementById("auth-email").value.trim().toLowerCase();
      const password = document.getElementById("auth-password").value;
      const users = getStoredUsers();

      if (!email || password.length < 5) {
        setStatus("Use a username and at least 5 password characters.", true);
        return;
      }

      const existing = users.find((user) => user.email === email);
      const passwordHash = await hashPassword(password);

      if (authMode === "login" && email === "admin" && password === "admin") {
        setAuthSession({ name: "Admin", email: "admin" });
        return;
      }

      if (authMode === "register") {
        if (existing) {
          setStatus("This email is already registered.", true);
          return;
        }
        const user = { name: name || email.split("@")[0], email, passwordHash, createdAt: new Date().toISOString() };
        users.push(user);
        saveStoredUsers(users);
        setAuthSession(user);
        return;
      }

      if (!existing || existing.passwordHash !== passwordHash) {
        setStatus("Email or password is incorrect.", true);
        return;
      }

      setAuthSession(existing);
    }

    function applyTheme(theme) {
      const nextTheme = theme === "light" ? "light" : "dark";
      document.documentElement.dataset.theme = nextTheme;
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
    }

    document.querySelectorAll("[data-auth-mode]").forEach((btn) => {
      btn.addEventListener("click", () => setAuthMode(btn.dataset.authMode));
    });

    document.getElementById("google-login").addEventListener("click", requestGoogleLogin);
    document.getElementById("guest-login").addEventListener("click", loginAsGuest);
    document.getElementById("auth-form").addEventListener("submit", submitAuthForm);
    document.getElementById("theme-toggle").addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
    });

    try {
      if (localStorage.getItem(AUTH_SESSION_KEY)) window.location.href = "index.html";
    } catch (_err) {}
    finishGoogleRedirectLogin();
  </script>
</body>
</html>
