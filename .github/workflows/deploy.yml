name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 45m
          script: |
            set -Eeuo pipefail

            wait_for_url() {
              local name="$1"
              local url="$2"
              local attempts="${3:-30}"
              local delay="${4:-2}"
              for i in $(seq 1 "$attempts"); do
                if curl --fail --silent --show-error "$url" >/dev/null; then
                  echo "$name is healthy."
                  return 0
                fi
                echo "Waiting for $name ($i/$attempts)..."
                sleep "$delay"
              done
              echo "$name did not become healthy: $url" >&2
              return 1
            }

            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/webcanhbaoo"
            fi
            cd "$APP_DIR"

            echo "Fetching latest main..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing backend dependencies..."
            cd "$APP_DIR/backend"
            npm ci

            echo "Preparing Hanoi proxy Python environment..."
            cd "$APP_DIR/ai_module"
            if [ ! -x venv/bin/python ]; then
              python3 -m venv venv
            fi
            ./venv/bin/python -m pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            echo "Reloading PM2 services..."
            cd "$APP_DIR/backend"
            mkdir -p logs
            AI_MODULE_PYTHON="$APP_DIR/ai_module/venv/bin/python" \
              pm2 startOrReload ecosystem.config.js --env production --update-env
            pm2 save

            echo "Checking backend health..."
            wait_for_url "backend" "http://127.0.0.1:3000/api/health" 30 2

            echo "Checking Hanoi proxy health..."
            wait_for_url "Hanoi proxy" "http://127.0.0.1:5001/health" 30 2

            echo "Checking AI detector health..."
            wait_for_url "AI detector" "http://127.0.0.1:5055/health" 60 3

            echo "Deployment completed."
